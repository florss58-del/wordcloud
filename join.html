<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>단어 제출 - 실시간 워드클라우드</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./css/style.css?v=22" />
</head>
<body>
  <div class="page-title">
    <h1><svg class="icon title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg> 워드클라우드 참여</h1>
  </div>

  <main>
    <div class="container">
      <div class="card">
        <p id="question" class="join-question">질문을 불러오는 중...</p>
        <div id="sessionInfo" class="join-info hidden"></div>
        <p id="remain" class="join-remain"></p>

        <div id="inputArea">
          <div class="field hidden" id="nickField">
            <input id="nickInput" class="input" maxlength="12" placeholder="이름 (최대 12자)" autocomplete="off" />
          </div>
          <div class="field" id="wordField">
            <input id="wordInput" class="input" maxlength="12" placeholder="단어 하나만 입력 (최대 12자)" autocomplete="off" />
          </div>
          <button id="submitBtn" class="btn btn-primary btn-block">제출하기</button>
          <div id="rsvpBtns" class="rsvp-btns hidden">
            <button id="rsvpYesBtn" class="btn btn-primary">참석</button>
            <button id="rsvpNoBtn" class="btn btn-ghost">불참</button>
          </div>
          <p id="status" class="status-msg"></p>
        </div>

        <div id="doneArea" class="join-done hidden">
          <p class="big"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#0066cc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg></p>
          <p><strong id="doneTitle">제출 완료!</strong><br /><span id="doneSub">이제 앞의 화면을 봐주세요.</span></p>
          <div id="editArea" class="hidden">
            <p class="join-mylink" id="myLink"></p>
            <button id="editBtn" class="btn btn-ghost btn-block">잘못 올렸어요 · 고치기</button>
          </div>
        </div>

        <div id="closedArea" class="join-done hidden">
          <p class="big"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#86868b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></p>
          <p><strong>세션이 종료되었습니다</strong><br />참여해 주셔서 감사합니다</p>
        </div>

        <div id="windowArea" class="join-done hidden">
          <p class="big"><svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#86868b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></p>
          <p><strong id="windowTitle"></strong><br /><span id="windowSub"></span></p>
          <p id="windowMine" class="join-mylink hidden"></p>
        </div>
        <p id="windowNote" class="join-window hidden"></p>

        <div id="myWords" class="submitted-words"></div>
        <p id="rsvpCount" class="rsvp-count hidden"></p>
      </div>
    </div>
  </main>

  <footer class="footer">
    <p class="footer__line">
      &copy; 2026 EUNACLASS
      <span class="footer__sep">&middot;</span>
      AI Learning Tools for Education
    </p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="./js/firebase-config.js"></script>
  <script src="./js/common.js?v=19"></script>
  <script src="./js/korean.js"></script>
  <script>
    const db = initFirebase();
    const code = getCodeFromUrl();
    const clientId = getClientId();

    const questionEl = document.getElementById("question");
    const remainEl = document.getElementById("remain");
    const inputArea = document.getElementById("inputArea");
    const doneArea = document.getElementById("doneArea");
    const closedArea = document.getElementById("closedArea");
    const wordInput = document.getElementById("wordInput");
    const nickField = document.getElementById("nickField");
    const nickInput = document.getElementById("nickInput");
    const submitBtn = document.getElementById("submitBtn");
    const statusEl = document.getElementById("status");
    const myWordsEl = document.getElementById("myWords");

    const editArea = document.getElementById("editArea");
    const editBtn = document.getElementById("editBtn");
    const myLinkEl = document.getElementById("myLink");

    let maxPerUser = 3;
    let inputMode = "word"; // "word" | "phrase" | "link"
    let sessionClosed = false;
    const storageKey = "wc_submitted_" + code;
    let myWords = JSON.parse(localStorage.getItem(storageKey) || "[]");

    // 작품 링크 모드 — 내가 올린 항목의 키를 기억해 두면 나중에 고칠 수 있다
    const linkKey = "wc_link_" + code;
    let myEntry = JSON.parse(localStorage.getItem(linkKey) || "null"); // {id, nick, url}

    // 참여 시간 — 강사가 정한 시작·마감(없으면 null). 서버 시각으로 판단한다(기기 시계가 틀려도 맞게)
    let openAt = null, closeAt = null, serverOffset = 0;
    const windowArea = document.getElementById("windowArea");
    const windowNoteEl = document.getElementById("windowNote");
    const winState = () => windowStateOf(openAt, closeAt, Date.now() + serverOffset);
    let lastWinState = "open";

    // 참석 확인 형식 — 이름을 적고 참석·불참 버튼을 누른다. 답은 "이름 참석"처럼 문구 하나로 저장한다
    let rsvpMode = false;
    const rsvpBtns = document.getElementById("rsvpBtns");
    const rsvpCountEl = document.getElementById("rsvpCount");
    // 버튼에 보이는 이름. 저장되는 답은 늘 참석/불참이고 화면 글자만 강사가 정한다
    let labels = rsvpLabels();
    let rsvpYes = 0, rsvpNo = 0;
    const labelOf = (status) => (status === RSVP_YES ? labels.yes : labels.no);
    function renderRsvpLabels() {
      document.getElementById("rsvpYesBtn").textContent = labels.yes;
      document.getElementById("rsvpNoBtn").textContent = labels.no;
      rsvpCountEl.textContent = `지금까지 응답 ${rsvpYes + rsvpNo}명 · ${labels.yes} ${rsvpYes}명 · ${labels.no} ${rsvpNo}명`;
    }

    function setStatus(message, type) {
      statusEl.textContent = message;
      statusEl.className = "status-msg " + (type || "");
    }

    function renderMyState() {
      const left = maxPerUser - myWords.length;
      if (rsvpMode) {
        remainEl.textContent = myWords.length ? "" : "이름을 적고 아래 버튼을 눌러 주세요";
      } else if (inputMode === "link") {
        remainEl.textContent = myWords.length ? "" : "이름과 작품 주소를 올려요";
      } else {
        remainEl.textContent = myWords.length
          ? `제출 ${myWords.length}/${maxPerUser}개`
          : `${maxPerUser}개까지 제출할 수 있어요`;
      }
      myWordsEl.innerHTML = rsvpMode ? "" : myWords.map((w) => `<span class="chip">${escapeHtml(w)}</span>`).join("");

      if (sessionClosed) {
        inputArea.classList.add("hidden");
        doneArea.classList.add("hidden");
        windowArea.classList.add("hidden");
        windowNoteEl.classList.add("hidden");
        closedArea.classList.remove("hidden");
        return;
      }
      closedArea.classList.add("hidden");

      // 참여 시간 밖이면 입력을 감추고 이유를 알려 준다
      const ws = winState();
      lastWinState = ws;
      if (ws !== "open") {
        inputArea.classList.add("hidden");
        doneArea.classList.add("hidden");
        windowNoteEl.classList.add("hidden");
        remainEl.textContent = "";
        document.getElementById("windowTitle").textContent = ws === "before" ? "아직 참여 시간이 아닙니다" : "참여 시간이 끝났습니다";
        document.getElementById("windowSub").textContent = ws === "before"
          ? formatWhen(openAt) + "부터 참여할 수 있습니다"
          : formatWhen(closeAt) + "에 마감되었습니다";
        const mineEl = document.getElementById("windowMine");
        const mine = rsvpMode && myEntry ? "내 응답: " + myEntry.nick + " · " + labelOf(myEntry.status) : "";
        mineEl.textContent = mine;
        mineEl.classList.toggle("hidden", !mine);
        windowArea.classList.remove("hidden");
        return;
      }
      windowArea.classList.add("hidden");
      windowNoteEl.textContent = closeAt ? "참여 마감: " + formatWhen(closeAt) : "";
      windowNoteEl.classList.toggle("hidden", !closeAt);
      if (left <= 0) {
        inputArea.classList.add("hidden");
        doneArea.classList.remove("hidden");
        // 링크 모드에서는 잘못 올렸을 때 고칠 수 있게 열어 둔다
        if (rsvpMode && myEntry) {
          myLinkEl.textContent = myEntry.nick + " · " + labelOf(myEntry.status);
          editBtn.textContent = "답을 바꿀게요";
          editArea.classList.remove("hidden");
        } else if (inputMode === "link" && myEntry) {
          myLinkEl.textContent = myEntry.nick + " · " + myEntry.url;
          editArea.classList.remove("hidden");
        }
      } else {
        inputArea.classList.remove("hidden");
        doneArea.classList.add("hidden");
      }
    }

    async function init() {
      if (!db) return;
      if (!code) {
        questionEl.textContent = "잘못된 접속입니다. QR코드나 링크로 다시 접속해 주세요.";
        inputArea.classList.add("hidden");
        return;
      }
      const snap = await sessionRef(db, code).child("meta").get();
      if (!snap.exists()) {
        questionEl.textContent = "세션을 찾을 수 없습니다. 코드를 확인해 주세요.";
        inputArea.classList.add("hidden");
        return;
      }
      const meta = snap.val();
      rsvpMode = renderQuestion(questionEl, meta.q).form === "rsvp";
      maxPerUser = Number(meta.max) || 3;
      inputMode = meta.mode === "phrase" || meta.mode === "link" ? meta.mode : "word";

      // 안내문(일시·장소·준비물·회차별 내용)이 있으면 질문 위에 그대로 보여 준다. 줄바꿈은 CSS가 살린다
      const infoEl = document.getElementById("sessionInfo");
      sessionRef(db, code).child("meta").child("info").on("value", (infoSnap) => {
        const info = infoSnap.val();
        const has = typeof info === "string" && info.trim().length > 0;
        infoEl.textContent = "";
        if (has) {
          // 줄마다 나눠 그린다. 머리표가 있는 줄은 머리표와 글을 따로 놓아 꺾여도 가지런하게
          info.replace(/\s+$/, "").split(String.fromCharCode(10)).forEach((raw) => {
            const row = document.createElement("div");
            const body = raw.trim();
            if (!body) { row.className = "join-info-gap"; infoEl.appendChild(row); return; }
            const indented = /^\s+/.test(raw);
            const m = body.match(/^(■|□|▶|●|※|-|·|•|\d+회차|\d+[.)])\s+(.*)$/);
            row.className = "join-info-line";
            if (m) {
              const mark = document.createElement("span");
              mark.className = "join-info-mark";
              mark.textContent = m[1];
              const text = document.createElement("span");
              text.textContent = m[2];
              row.appendChild(mark);
              row.appendChild(text);
              if (/^[■□▶●]$/.test(m[1])) row.classList.add("is-head");
              else if (/^\d/.test(m[1])) row.classList.add("is-step");
            } else {
              const text = document.createElement("span");
              text.textContent = body;
              row.appendChild(text);
            }
            if (indented) row.classList.add("is-sub");
            infoEl.appendChild(row);
          });
        }
        infoEl.classList.toggle("hidden", !has);
      });

      // 참여 시간 — 강사가 고치면 바로 따라간다. 시각이 지나 상태가 바뀔 때만 화면을 다시 그린다
      // (주기적으로 통째로 다시 그리면 "답을 바꿀게요"로 연 입력창이 닫혀 버린다)
      sessionRef(db, code).child("meta").child("open").on("value", (v) => { openAt = Number(v.val()) || null; renderMyState(); });
      sessionRef(db, code).child("meta").child("close").on("value", (v) => { closeAt = Number(v.val()) || null; renderMyState(); });
      db.ref(".info/serverTimeOffset").on("value", (v) => { serverOffset = Number(v.val()) || 0; if (winState() !== lastWinState) renderMyState(); });
      setInterval(() => { if (winState() !== lastWinState) renderMyState(); }, 5000);

      // 강사가 주제를 수정하면 학생 화면에도 즉시 반영
      sessionRef(db, code).child("meta").child("q").on("value", (qSnap) => {
        const q = qSnap.val();
        if (typeof q === "string" && q.length) renderQuestion(questionEl, q);
      });
      if (rsvpMode) {
        document.title = "참석 확인 - EUNACLASS";
        document.querySelector(".page-title h1").lastChild.nodeValue = " 참석 확인";
        maxPerUser = 1;
        nickField.classList.remove("hidden");
        nickInput.placeholder = "이름만 적어 주세요 (예: 홍길동)";
        document.getElementById("wordField").classList.add("hidden");
        submitBtn.classList.add("hidden");
        rsvpBtns.classList.remove("hidden");
        document.getElementById("doneTitle").textContent = "응답 완료!";
        document.getElementById("doneSub").textContent = "응답이 저장되었습니다";
        // 지금까지 몇 명이 답했는지 함께 보여 준다 (이름은 발표 화면에만 나온다)
        rsvpCountEl.classList.remove("hidden");
        sessionRef(db, code).child("entries").on("value", (entriesSnap) => {
          let yes = 0, no = 0;
          entriesSnap.forEach((child) => {
            const r = parseRsvp((child.val() || {}).w);
            if (!r) return;
            if (r.status === RSVP_YES) yes += 1; else no += 1;
          });
          rsvpYes = yes; rsvpNo = no;
          renderRsvpLabels();
        });
        // 강사가 버튼 이름을 고치면 바로 따라간다
        const applyLabels = () => { renderRsvpLabels(); renderMyState(); };
        let metaYes = meta.yes, metaNo = meta.no;
        labels = rsvpLabels(metaYes, metaNo);
        renderRsvpLabels();
        sessionRef(db, code).child("meta").child("yes").on("value", (v) => { metaYes = v.val(); labels = rsvpLabels(metaYes, metaNo); applyLabels(); });
        sessionRef(db, code).child("meta").child("no").on("value", (v) => { metaNo = v.val(); labels = rsvpLabels(metaYes, metaNo); applyLabels(); });
      } else if (inputMode === "phrase") {
        wordInput.maxLength = 30;
        wordInput.placeholder = "짧은 문구를 입력하세요 (최대 30자)";
      } else if (inputMode === "link") {
        document.title = "작품 공유 - EUNACLASS";
        nickField.classList.remove("hidden");
        wordInput.maxLength = 300;
        wordInput.type = "url";
        wordInput.placeholder = "만든 작품의 주소를 붙여넣기";
        wordInput.inputMode = "url";
        submitBtn.textContent = "내 작품 올리기";
      }
      renderMyState();
      (inputMode === "link" || rsvpMode ? nickInput : wordInput).focus();

      // 강사가 세션을 종료하면 실시간으로 입력 차단
      sessionRef(db, code).child("closed").on("value", (closedSnap) => {
        sessionClosed = closedSnap.val() === true;
        renderMyState();
      });
    }

    /* 도구마다 주소를 https:// 없이 복사해 주기도 한다 (Canva의 "사이트 주소" 복사 버튼이 그렇다).
       학생이 붙여넣은 그대로 막히면 안 되므로 앞을 채워 준다. 주소가 아니면 null. */
    function normalizeUrl(raw) {
      let url = (raw || "").trim().replace(/\s+/g, "");
      if (!url) return null;
      if (url.startsWith("http://")) url = "https://" + url.slice(7);
      if (!url.startsWith("https://")) {
        // 도메인처럼 생겼을 때만 앞을 채운다 (제목·아이디를 붙여넣은 경우와 구분)
        if (!/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(url)) return null;
        url = "https://" + url;
      }
      try { new URL(url); } catch (e) { return null; }
      return url;
    }

    // 작품 링크 모드 — 주소가 아닌 입력(제목·아이디)을 학생 눈높이로 잡아준다
    async function submitLink() {
      // 이미 올렸어도 "고치기"로 다시 올리는 건 허용한다 (myEntry가 있으면 덮어쓰기)
      if (sessionClosed) return;
      if (winState() !== "open") { renderMyState(); return; }
      if (!myEntry && myWords.length >= maxPerUser) return;

      const nick = nickInput.value.trim();
      const url = normalizeUrl(wordInput.value);

      if (nick.length < 1) { setStatus("이름을 먼저 적어주세요.", "error"); nickInput.focus(); return; }
      if (nick.length > 12) { setStatus("이름은 12자까지예요.", "error"); return; }
      if (!wordInput.value.trim()) { setStatus("작품 주소를 붙여넣어 주세요.", "error"); return; }
      if (!url) {
        setStatus("주소가 아닌 것 같아요. 작품 주소를 복사해 붙여넣어 주세요.", "error");
        return;
      }
      if (url.length > 300) { setStatus("주소가 너무 길어요. 다시 확인해 주세요.", "error"); return; }

      submitBtn.disabled = true;
      try {
        const payload = {
          w: url,
          n: nick,
          c: clientId,
          t: firebase.database.ServerValue.TIMESTAMP
        };

        if (myEntry && myEntry.id) {
          // 고치기 — 발표 화면의 카드가 제자리에서 바뀐다 (새 카드가 생기지 않는다)
          await sessionRef(db, code).child("entries").child(myEntry.id).set(payload);
          myEntry = { id: myEntry.id, nick, url };
          setStatus("고쳤어요! 앞 화면을 봐주세요.", "success");
        } else {
          const ref = await sessionRef(db, code).child("entries").push(payload);
          myEntry = { id: ref.key, nick, url };
          myWords.push(nick);
          localStorage.setItem(storageKey, JSON.stringify(myWords));
          setStatus("올렸어요! 앞 화면을 봐주세요.", "success");
        }
        localStorage.setItem(linkKey, JSON.stringify(myEntry));
        wordInput.value = "";
        renderMyState();
      } catch (error) {
        setStatus("올리지 못했어요. 잠시 후 다시 시도해 주세요.", "error");
      } finally {
        submitBtn.disabled = false;
      }
    }

    // 참석 확인 — 이름 + 누른 버튼을 한 문구로 저장한다. 다시 누르면 같은 항목을 덮어쓴다(답 바꾸기)
    async function submitRsvp(status) {
      if (sessionClosed) return;
      if (winState() !== "open") { renderMyState(); return; }
      if (!myEntry && myWords.length >= maxPerUser) return;

      const checked = validatePhrase(nickInput.value);
      if (!checked.ok) {
        setStatus(nickInput.value.trim() ? checked.reason : "이름을 먼저 적어 주세요.", "error");
        nickInput.focus();
        return;
      }
      // 이름은 글자만 남긴다 — 띄어쓰기·기호·점·숫자를 모두 뺀다 ("김 은아."와 "김은아"가 다른 사람처럼 보이지 않게).
      // 입력 도중에 지우면 한글 조합이 깨지므로 누르는 순간에 정리한다
      const nick = checked.word.replace(/[^가-힣a-zA-Z]/g, "");
      nickInput.value = nick;
      if (nick.length < 2) { setStatus("이름을 두 글자 이상 적어 주세요.", "error"); nickInput.focus(); return; }
      if (nick.length > 12) { setStatus("이름은 12자까지예요.", "error"); return; }

      const buttons = [document.getElementById("rsvpYesBtn"), document.getElementById("rsvpNoBtn")];
      buttons.forEach((b) => { b.disabled = true; });
      try {
        const payload = { w: nick + " " + status, c: clientId, t: firebase.database.ServerValue.TIMESTAMP };
        if (myEntry && myEntry.id) {
          await sessionRef(db, code).child("entries").child(myEntry.id).set(payload);
          myEntry = { id: myEntry.id, nick, status };
        } else {
          const ref = await sessionRef(db, code).child("entries").push(payload);
          myEntry = { id: ref.key, nick, status };
          myWords.push(nick);
          localStorage.setItem(storageKey, JSON.stringify(myWords));
        }
        localStorage.setItem(linkKey, JSON.stringify(myEntry));
        setStatus("", "");
        renderMyState();
      } catch (error) {
        setStatus("저장하지 못했어요. 잠시 후 다시 눌러 주세요.", "error");
      } finally {
        buttons.forEach((b) => { b.disabled = false; });
      }
    }
    document.getElementById("rsvpYesBtn").addEventListener("click", () => submitRsvp(RSVP_YES));
    document.getElementById("rsvpNoBtn").addEventListener("click", () => submitRsvp(RSVP_NO));

    // 고치기 — 올렸던 이름·주소를 그대로 불러와 다시 입력창을 연다
    if (editBtn) {
      editBtn.addEventListener("click", () => {
        if (!myEntry) return;
        if (rsvpMode) {
          nickInput.value = myEntry.nick;
          doneArea.classList.add("hidden");
          inputArea.classList.remove("hidden");
          setStatus("이름을 확인하고 다시 눌러 주세요.", "");
          return;
        }
        nickInput.value = myEntry.nick;
        wordInput.value = myEntry.url;
        submitBtn.textContent = "고쳐서 다시 올리기";
        doneArea.classList.add("hidden");
        inputArea.classList.remove("hidden");
        setStatus("", "");
        wordInput.focus();
        wordInput.select();
      });
    }

    async function submitWord() {
      if (rsvpMode) return;   // 참석 확인은 참석·불참 버튼으로만 낸다
      if (inputMode === "link") return submitLink();
      if (sessionClosed || myWords.length >= maxPerUser) return;
      if (winState() !== "open") { renderMyState(); return; }

      const result = inputMode === "phrase" ? validatePhrase(wordInput.value) : validateWord(wordInput.value);
      if (!result.ok) { setStatus(result.reason, "error"); return; }
      // 답이 아닌 게 분명한 입력만 막는다 (세션 코드 그대로 적기, 한 글자 답)
      if (result.word.toUpperCase() === code) {
        setStatus("참여 코드 말고, 질문에 대한 답을 적어주세요.", "error");
        return;
      }
      if (inputMode === "word" && result.word.length < 2) {
        setStatus("두 글자 이상으로 적어주세요.", "error");
        return;
      }
      if (myWords.includes(result.word)) {
        setStatus("이미 제출한 단어예요. 다른 단어를 적어주세요.", "error");
        return;
      }

      submitBtn.disabled = true;
      try {
        await sessionRef(db, code).child("entries").push({
          w: result.word,
          c: clientId,
          t: firebase.database.ServerValue.TIMESTAMP
        });
        myWords.push(result.word);
        localStorage.setItem(storageKey, JSON.stringify(myWords));
        wordInput.value = "";
        setStatus(`“${result.word}” 제출 완료!`, "success");
        renderMyState();
      } catch (error) {
        setStatus("제출에 실패했어요. 잠시 후 다시 시도해 주세요.", "error");
      } finally {
        submitBtn.disabled = false;
        wordInput.focus();
      }
    }

    submitBtn.addEventListener("click", submitWord);
    wordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") submitWord(); });
    nickInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !rsvpMode) wordInput.focus(); });

    init();
  </script>
</body>
</html>
